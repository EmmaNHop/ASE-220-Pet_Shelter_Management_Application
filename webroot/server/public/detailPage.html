<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="Nate Brewer, Danny Poff, Emma Hopkins" />
    <title>Pet page</title>

    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="assets/css/detailStyles.css" rel="stylesheet" />
    <link href="assets/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="canonical" href="https://getbootstrap.com/docs/5.3/examples/album/">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@docsearch/css@3" />
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.8.1/font/bootstrap-icons.min.css">
</head>

<body data-bs-theme="dark">
    <!-- Responsive navbar-->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand" href="#!">Pet Page</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- Page content-->
    <main>
        <div class="container mt-5">
            <div class="row">
                <div class="col-lg-6">
                    <!-- Post content-->
                    <article>
                        <!-- Post header-->
                        <header class="mb-4">
                            <button id="edit" data-bs-toggle="modal" data-bs-target="#editModal"
                                class="btn btn-success">
                                Edit
                            </button>
                            <!--Name of animal-->
                            <h1 class="fw-bolder mb-1" id="name"></h1>
                            <!-- Maybe deal with post date, would need another section in pets data or something-->
                            <div class="text-muted fst-italic mb-2">
                                Posted on <span class="small" id="date"></span>
                            </div>
                            <!-- Animal Type-->
                        </header>
                        <!-- Preview image figure-->
                        <figure class="mb-4 shadow border rounded border-2 border-secondary">
                            <img class="img-fluid rounded" style="width: 100%; height: auto" id="picture" alt="..." />
                        </figure>
                    </article>
                </div>
                <!-- Side widgets-->
                <div class="col-lg-6">
                    <!-- Bio-->
                    <div class="card mb-4 bg-dark text-white border-secondary border-2 shadow">
                        <div class="small m-3" id="bio"></div>
                    </div>
                    <!-- Side widget-->
                    <div class="card mb-4 bg-dark text-white border-secondary border-2 shadow">
                        <div class="card-header">Description</div>
                        <div class="card-body m-1">
                            <table class="table mb-0 text-white border-secondary">
                                <tbody>
                                    <tr>
                                        <th scope="row" class="small fw-bolder">Animal:</th>
                                        <td class="small" id="type"></td>
                                    </tr>
                                    <tr>
                                        <th scope="row" class="small fw-bolder">Breed:</th>
                                        <td class="small" id="breed"></td>
                                    </tr>
                                    <tr>
                                        <th scope="row" class="small fw-bolder">Gender:</th>
                                        <td class="small" id="sex"></td>
                                    </tr>
                                    <tr>
                                        <th scope="row" class="small fw-bolder">Age:</th>
                                        <td class="small" id="age"></td>
                                    </tr>
                                    <tr>
                                        <th scope="row" class="small fw-bolder">Color:</th>
                                        <td class="small" id="color"></td>
                                    </tr>
                                    <tr>
                                        <th scope="row" class="small fw-bolder">
                                            Spayed/Neutered:
                                        </th>
                                        <td class="small" id="sn"></td>
                                    </tr>
                                    <tr>
                                        <th scope="row" class="small fw-bolder">Health:</th>
                                        <td class="small" id="stat"></td>
                                    </tr>
                                    <tr style="display: none;">
                                        <th scope="row" class="small fw-bolder" style="display: none;">Microchip:</th>
                                        <td class="small" id="microchip" style="display: none;"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!--edit Pet Modal-->
        <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalLabel">Pet Information</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <!-- New Pet input -->
                        <form id="myForm">
                            <div class="row">
                                <div class="col-6">
                                    <input class="form-control m-1" type="text" id="form-name" name="name" placeholder="Enter name" />
                                    <input class="form-control m-1" type="text" id="form-breed" name="breed" placeholder="Enter Breed" />
                                    <input class="form-control m-1" type="text" id="form-type" name="type" placeholder="Enter type of animal" />
                                    <div class="row">
                                        <div class="col-2">
                                            Sex:
                                        </div>
                                        <div class="col-2">
                                            <input class="form-check-input" type="radio" name="gender" id="sexMale" value="Male"/>
                                            <label class="form-check-label" for="sexMale">Male</label>
                                        </div>
                                        <div class="col-3">
                                            <input class="form-check-input" type="radio" name="gender" id="sexFemale" value="Female"/>
                                            <label class="form-check-label" for="sexFemale">Female</label>
                                        </div>
                                        <div class="col-5">
                                            <input class="form-check-input" type="radio" name="gender" id="sexUnknown" value="Unknown"/>
                                            <label class="form-check-label" for="sexUnknown">Unknown</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <input class="form-control m-1" type="text" id="form-color" name="color" placeholder="Enter animal's color" />
                                    <input class="form-control m-1" type="text" id="form-age" name="age" placeholder="Enter age" />
                                    <input class="form-control m-1" type="text" id="form-microchip" name="microchip" placeholder="Enter microchip number" />
                                    <div class="row">
                                        <div class="col-3">
                                            Fixed:
                                        </div>
                                        <div class="col-2">
                                            <input class="form-check-input" type="radio" name="fixed" id="fixedYes">
                                            <label class="form-check-label" name="fixed">Yes</label>
                                        </div>
                                        <div class="col-2">
                                            <input class="form-check-input" type="radio" name="fixed" id="fixedNo">
                                            <label class="form-check-label" name="fixed">No</label>
                                        </div>
                                        <div class="col-4">
                                            <input class="form-check-input" type="radio" name="fixed" id="unknown">
                                            <label class="form-check-label" name="fixed">Unknown</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <input class="form-control m-1" type="text" id="form-picture" name="picture" placeholder="Enter Picture URL" />
                            <textarea class="form-control m-1" type="text" id="form-status" name="status" placeholder="Enter status" rows="3"></textarea>
                            <textarea class="form-control m-1" type="textarea" id="form-bio" name="bio" placeholder="Enter bio" rows="8"></textarea>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <!--save info into pets.js, will have to add id and data ourselves. Status may need to be broken up somehow-->
                        <button id="submit" type="button" class="btn btn-primary" data-bs-dismiss="modal">Submit</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer-->
    <div class="py-5 bg-dark text-white">
        <div class="d-flex justify-content-center container">
            <div class="text-center">
                <p class="mb-0">© 2021 Pet Shelter ™</p>
                <div class="mb-1">Danny Poff • Nate Brewer • Emma Hopkins</div>
                <div class="mb-1">
                    <a href="#">Back to top</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        // This grabs the query string and will call the json file from pets.js and get the specific pet data from it
        const urlParams = new URLSearchParams(window.location.search);
        const myParam = urlParams.get("id");

        async function fetchPets() {
            let pet = await axios.get("http://127.0.0.1:3000/api/pets");
            //console.log(pet.data);
            return pet.data;
        }


        //load data into the modal
      async function loadEditModal() {

            console.log("modal loaded");
            var stat = "";
            let statContent = document.getElementById("stat").childNodes;
            for (let i = 0; i < statContent.length-1; i++) {
                if(statContent[i].localName == "br"){    
                } else {
                    stat += statContent[i].data + ", ";
                }
            }
            stat += statContent[statContent.length-1].data;
            
            document.getElementById("form-name").value = document.getElementById("name").innerHTML; 
            document.getElementById("form-picture").value = document.getElementById("picture").src; //assuming
            document.getElementById("form-breed").value = document.getElementById("breed").innerHTML;
            document.getElementById("form-type").value = document.getElementById("type").innerHTML;
            const sex = document.getElementById("sex").innerHTML;
            if (sex === "Male") {
                document.getElementById("sexMale").checked = true;
            } else if (sex === "Female") {
                document.getElementById("sexFemale").checked = true;
            } else {
                document.getElementById("sexUnknown").checked = true;
            }
            document.getElementById("form-color").value = document.getElementById("color").innerHTML;
            document.getElementById("form-microchip").value = document.getElementById("microchip").innerHTML; //assuming
            const fixed = document.getElementById("sn").innerHTML;
            if (fixed === "Yes" || "yes") {
                document.getElementById("fixedYes").checked = true;
            } else if (fixed === "No" || "no") {
                document.getElementById("fixedNo").checked = true;
            } else {
                document.getElementById("unknown").checked = true;
            }
            
            document.getElementById("form-age").value = document.getElementById("age").innerHTML;  

            document.getElementById("form-status").value = `${stat}`; 
            document.getElementById("form-bio").value = document.getElementById("bio").innerHTML;     
 

        }


    // Call the function when the modal is shown
    document.getElementById("editModal").addEventListener("show.bs.modal", loadEditModal);
       


    const form = document.getElementById("myForm"); // Correctly reference the form with id "myForm"
        // Function to handle editing a pet
        document.getElementById("submit").addEventListener("click", function () {
            const petID = myParam; // Using the 'id' query parameter from the URL as the pet ID

            const name = form.elements["name"].value;
            const breed = form.elements["breed"].value;
            const type =form.elements["type"].value;
            const gender = form.elements["gender"].value;
            const color = form.elements["color"].value;
            const fixed = form.elements["fixed"].value;
            const age = form.elements["age"].value;
            const bio = form.elements["bio"].value;
            const microchip = form.elements["microchip"].value;
            const status = form.elements["status"].value;
            const picture = form.elements["picture"].value;


            const updatedPet = {
                "name": name,
                "pic": picture,
                "breed": breed,
                "type": type,
                "sex": gender,
                "color": color,
                "spayedNeutered": fixed,
                "age": age,
                "id": petID,
                "microchipNumber": microchip,
                "datePosted": new Date(),
                "status": [
                    status
                ],
                "bio": bio
            };
           
            console.log(updatedPet);

            axios
                .put(`http://127.0.0.1:3000/api/pets/${petID}`, updatedPet)
                .then((response) => {
                    console.log("Pet successfully updated:", response.data);
                    // Optionally refresh the pet list or update the UI
                })
                .catch((error) => {
                    console.error("Error updating pet:", error);
                });
        });

        async function fetchPets() {
            let pet = await axios.get(`http://127.0.0.1:3000/api/pets/${myParam}`);
            console.log(pet.data);
            return pet.data;
        }


        //loads pets

        async function loadPet(pets) {
            // Just to help expedite the process for ya
            let petName = pets.name;
            let petType = pets.type;
            let petBreed = pets.breed;
            let petSex = pets.sex;
            let petAge = pets.age;
            let petColor = pets.color;
            let petBio = pets.bio;
            let petPic = pets.pic;
            let petSN = pets.spayedNeutered;
            let petStat = pets.status;
            let petDate = pets.datePosted;
            let micro = pets.microchipNumber;

            var img = document.createElement("img");
            img.src = petPic;

            // This will change the image to the pet picture
            document.getElementById("picture").src = petPic;

            // This will change the HTML to the pet data
            document.getElementById("name").innerHTML = petName;
            document.getElementById("date").innerHTML = petDate;
            document.getElementById("type").innerHTML = petType;
            document.getElementById("breed").innerHTML = petBreed;
            document.getElementById("bio").innerHTML = petBio;
            document.getElementById("sex").innerHTML = petSex;
            document.getElementById("age").innerHTML = petAge;
            document.getElementById("color").innerHTML = petColor;
            document.getElementById("sn").innerHTML = petSN;
            document.getElementById("microchip").innerHTML = micro;

            for (let i = 0; i < petStat.length; i++) {
                document.getElementById("stat").innerHTML += petStat[i] + "<br>";
            }
        }

        fetchPets().then((pets) => {
            loadPet(pets);
        });
    
    </script>
    <!-- Bootstrap core JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core theme JS-->
    <script src="assets/js/detailScripts.js"></script>
</body>

</html>
